[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.17,<3.18",
    "drf-spectacular>=0.30,<0.31",
    "mssql-django>=1.7,<1.8",
    "pyodbc>=5.3,<5.4",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0,<7.1",
    "django-extensions>=4.1,<4.2",
    "pytest>=9.1,<9.2",
    "pytest-django>=4.12,<4.13",
    "ruff>=0.16,<0.17",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "Q",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]